name: Timvis uppdatering av dynamiska avgångar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Startdatum (YYYY-MM-DD). Tomt = dagens datum i UTC.'
        required: false
        default: ''

concurrency:
  group: dynamic-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Hämta dynamiska datumrader
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checka ut kod
        uses: actions/checkout@v4

      - name: Sätt upp Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installera beroenden
        run: pip install requests

      - name: Bestäm startdatum
        id: start
        shell: bash
        run: |
          FROM="${{ github.event.inputs.from_date }}"
          if [ -z "$FROM" ]; then
            FROM="$(date -u +%F)"
          fi
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "Startdatum: $FROM"

      - name: Kör update_fartyg.py
        env:
          FERRY_DYNAMIC_FORWARD_DAYS: "14"
        run: python3 update_fartyg.py "${{ steps.start.outputs.from }}"

      - name: Commit och push om farjor_data.json ändrats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add farjor_data.json
          if git diff --staged --quiet; then
            echo "Inga ändringar – inget commit behövs."
          else
            FROM="${{ steps.start.outputs.from }}"
            git commit -m "Auto: dynamiska avgångar uppdaterade $FROM (hourly) [skip ci]"
            git push
          fi
