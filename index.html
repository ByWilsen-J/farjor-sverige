<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Färjor till/från Sverige</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:   #0d2d5e; --blue:   #1a4a8a; --lblue:  #e6eef9;
  --border: #cdd8ee; --rowalt: #f4f7fc; --hover:  #dce8f8;
  --green:  #155c2e; --gbg:    #d4edda; --yellow: #7a5a00;
  --ybg:    #fff3cd; --orange: #8a3800; --obg:    #ffe0c0;
  --text:   #1a1a2e; --muted:  #5a6580; --radius: 8px;
  --shadow: 0 1px 4px rgba(0,0,0,.12);
}
body { font-family: system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14px; background:#edf1f9; color:var(--text); min-height:100vh; }
header { background:var(--navy); color:white; padding:0 24px; height:56px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 8px rgba(0,0,0,.35); position:sticky; top:0; z-index:100; }
header svg { flex-shrink:0; opacity:.9; }
header h1 { font-size:18px; font-weight:700; letter-spacing:.2px; }
.updated { margin-left:auto; font-size:12px; opacity:.65; white-space:nowrap; }
.controls { background:white; border-bottom:1px solid var(--border); padding:12px 24px; display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
.ctrl-group { display:flex; align-items:center; gap:8px; }
.ctrl-label { font-size:12px; font-weight:600; color:var(--blue); white-space:nowrap; }
.date-wrap { display:flex; align-items:center; gap:8px; }
.weekday-label { font-size:13px; font-weight:600; color:var(--navy); min-width:72px; }
input[type=date], select { height:34px; border:1px solid var(--border); border-radius:6px; padding:0 10px; font-size:13px; color:var(--text); background:white; outline:none; cursor:pointer; }
input[type=date]:focus, select:focus { border-color:var(--blue); }
.seg { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.seg button { padding:0 16px; height:34px; border:none; background:white; cursor:pointer; font-size:13px; font-weight:500; color:var(--muted); transition:background .12s,color .12s; white-space:nowrap; }
.seg button:not(:last-child) { border-right:1px solid var(--border); }
.seg button.on { background:var(--blue); color:white; font-weight:600; }
.seg button:hover:not(.on) { background:var(--lblue); color:var(--blue); }
.hamnpanel { background:white; border-bottom:1px solid var(--border); padding:10px 24px; display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
.hamngrupp { display:flex; flex-direction:column; gap:4px; min-width:110px; }
.hamngrupp-header { display:flex; align-items:center; gap:5px; margin-bottom:2px; }
.hamngrupp-name { font-size:11px; font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:.5px; }
.grupp-toggle { font-size:10px; color:var(--muted); cursor:pointer; text-decoration:underline; }
.grupp-toggle:hover { color:var(--blue); }
.hamn-check { display:flex; align-items:center; gap:5px; cursor:pointer; }
.hamn-check input { cursor:pointer; accent-color:var(--blue); }
.hamn-check span { font-size:12px; }
.clear-hamn { font-size:11px; color:var(--muted); cursor:pointer; text-decoration:underline; align-self:flex-end; padding-bottom:2px; }
.clear-hamn:hover { color:var(--blue); }
.infobar { background:var(--lblue); border-bottom:1px solid var(--border); padding:7px 24px; font-size:12.5px; color:var(--blue); display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
.infobar strong { font-weight:700; }
main { padding:20px 24px; }
.sec-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.sec-head h2 { font-size:14px; font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:.5px; }
.pill { background:var(--blue); color:white; border-radius:20px; padding:1px 10px; font-size:12px; font-weight:600; }
.tbl-wrap { border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; overflow-x:auto; margin-bottom:28px; }
table { width:100%; border-collapse:collapse; background:white; min-width:520px; }
thead tr { background:var(--navy); }
thead th { padding:10px 12px; text-align:left; font-size:11px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:rgba(255,255,255,.85); white-space:nowrap; user-select:none; }
thead th.sortable { cursor:pointer; }
thead th.sortable:hover { color:white; }
thead th .si { margin-left:4px; opacity:.5; font-size:10px; }
thead th.sort-asc .si::after  { content:' ▲'; opacity:1; }
thead th.sort-desc .si::after { content:' ▼'; opacity:1; }
thead th:not(.sort-asc):not(.sort-desc) .si::after { content:' ⇅'; }
tbody tr:nth-child(even) { background:var(--rowalt); }
tbody tr:hover { background:var(--hover); }
tbody tr.mot-sv  { border-left:3px solid #1a8a4a; }
tbody tr.fran-sv { border-left:3px solid #1a4a8a; }
td { padding:8px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
.t-time  { font-size:16px; font-weight:800; color:var(--navy); white-space:nowrap; display:block; }
.t-datum { font-size:10px; color:var(--muted); display:block; font-weight:400; margin-top:1px; }
.t-anktid { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; display:block; }
.plus1 { font-size:10px; color:#c05010; vertical-align:super; margin-left:1px; }
.t-hamn  { font-size:12px; color:var(--muted); }
.t-rederi { font-size:12px; color:var(--text); }
.arrow { color:var(--border); margin:0 3px; font-size:11px; }
.t-link a { color:var(--blue); opacity:.55; font-size:13px; text-decoration:none; }
.t-link a:hover { opacity:1; }
.badge { display:inline-flex; align-items:center; padding:2px 7px; border-radius:4px; font-size:10px; font-weight:600; white-space:nowrap; gap:3px; }
.b-pass { background:var(--lblue); color:var(--blue); }
.b-roro { background:#e2f0e2; color:var(--green); }
.b-ver  { background:var(--gbg); color:var(--green); }
.b-del  { background:var(--ybg); color:var(--yellow); }
.b-ej   { background:var(--obg); color:var(--orange); }
.iv-note { background:#fffbe6; border:1px solid #e8d060; border-radius:var(--radius); padding:9px 14px; font-size:12px; color:#6b5000; margin-bottom:12px; line-height:1.5; }
.empty { background:white; border-radius:var(--radius); box-shadow:var(--shadow); padding:48px 24px; text-align:center; color:var(--muted); margin-bottom:24px; }
.empty p { font-size:15px; }
#loading, #error-msg { text-align:center; padding:60px 24px; color:var(--muted); font-size:15px; }
#error-msg { color:#c00; display:none; }
#loading .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 14px; }
@keyframes spin { to { transform:rotate(360deg); } }
footer { background:white; border-top:1px solid var(--border); padding:14px 24px; font-size:12px; color:var(--muted); display:flex; gap:20px; flex-wrap:wrap; align-items:center; }
footer a { color:var(--blue); text-decoration:none; }
.legend { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
@media (max-width:640px) {
  header h1 { font-size:15px; }
  .controls, main { padding:10px 12px; }
  .infobar, .hamnpanel { padding:6px 12px; }
  thead th, td { padding:6px 8px; }
}
</style>
</head>
<body>

<header>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 17l1.5-5.5L12 9l7.5 2.5L21 17"/><path d="M3 17h18"/>
    <path d="M7 11.5V7a1 1 0 011-1h8a1 1 0 011 1v4.5"/><path d="M12 6V4"/>
  </svg>
  <h1>Färjor till/från Sverige</h1>
  <span class="updated" id="updated-label">Laddar…</span>
</header>

<div class="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">DATUM</span>
    <div class="date-wrap">
      <input type="date" id="dp">
      <span class="weekday-label" id="wday-label"></span>
    </div>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">RIKTNING</span>
    <div class="seg">
      <button id="btn-avgmot" onclick="setDir('avgmot')">⬇ Avgår mot Sverige</button>
      <button id="btn-ankmot" onclick="setDir('ankmot')">🇸🇪 Ankommer till Sverige</button>
      <button id="btn-fran"   onclick="setDir('fran')">⬆ Avgår från Sverige</button>
    </div>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">TYP</span>
    <select id="kat-filter">
      <option value="">Alla typer</option>
      <option value="Passagerare">Passagerare</option>
      <option value="RORO">RORO</option>
    </select>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">REDERI</span>
    <select id="rederi-filter"><option value="">Alla rederier</option></select>
  </div>
</div>

<div class="hamnpanel" id="hamnpanel"></div>
<div class="infobar" id="infobar">Laddar data…</div>

<main id="main">
  <div id="loading"><div class="spinner"></div>Hämtar tidtabellsdata…</div>
  <div id="error-msg">Kunde inte ladda farjor_data.json.</div>
</main>

<footer>
  <span>Data: <code>farjor_data.json</code> · Källor: Stena LiveView, Wasaline, Finnlines m.fl.</span>
  <div class="legend">
    <span class="badge b-ver">✓ Verif.</span>
    <span class="badge b-del">~ Delvis</span>
    <span class="badge b-ej">? Ej verif.</span>
  </div>
</footer>

<script>
const DAGMAP  = ['Sön','Mån','Tis','Ons','Tor','Fre','Lör'];
const DAGLONG = {Mån:'måndag',Tis:'tisdag',Ons:'onsdag',Tor:'torsdag',Fre:'fredag',Lör:'lördag',Sön:'söndag'};
const GRUPPER = {
  'ÖST':    ['Grisslehamn','Kapellskär','Stockholm','Nynäshamn'],
  'SYD':    ['Karlshamn','Karlskrona','Ystad','Trelleborg','Helsingborg','Malmö'],
  'VÄST':   ['Göteborg'],
  'ÖVRIGA': null
};

let DATA=null, DIR='avgmot', SORT_COL='avgtid', SORT_DIR='asc';
let CHECKED_HAMNAR = new Set();

const esc = s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function parseMin(t,nasta){
  if(!t) return 9999;
  const m=t.match(/(\d{1,2}):(\d{2})/);
  const v=m?+m[1]*60+ +m[2]:9999;
  return v+(nasta?1440:0);
}

function today(){ return new Date().toISOString().slice(0,10); }

function weekday(iso){ return DAGMAP[new Date(iso+'T12:00:00').getDay()]; }

function longDate(iso){
  return new Date(iso+'T12:00:00').toLocaleDateString('sv-SE',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

function fmtShort(d){
  return new Date(d+'T12:00:00').toLocaleDateString('sv-SE',{day:'numeric',month:'short'});
}

function updateWday(){
  const iso=document.getElementById('dp').value||today();
  const d=weekday(iso);
  document.getElementById('wday-label').textContent=DAGLONG[d]||d;
}

function verBadge(v){
  if(!v) return '';
  if(v.startsWith('Verifierad')) return '<span class="badge b-ver">✓ Verif.</span>';
  if(v.startsWith('Delvis'))     return '<span class="badge b-del">~ Delvis</span>';
  return '<span class="badge b-ej">? Ej verif.</span>';
}
function katBadge(k){
  return k==='Passagerare'
    ?'<span class="badge b-pass">🚢 Pax</span>'
    :'<span class="badge b-roro">🚛 RORO</span>';
}

// ── Hamnpanel ────────────────────────────────────────────────────────────────
function buildHamnPanel(){
  const all=DATA.meta.hamnar;
  const used=new Set();
  const gdata={};
  for(const[g,list] of Object.entries(GRUPPER)){
    if(!list){continue;}
    gdata[g]=list.filter(h=>all.includes(h));
    gdata[g].forEach(h=>used.add(h));
  }
  gdata['ÖVRIGA']=all.filter(h=>!used.has(h));

  let html='';
  for(const[g,hamnar] of Object.entries(gdata)){
    if(!hamnar.length) continue;
    html+=`<div class="hamngrupp">
      <div class="hamngrupp-header">
        <span class="hamngrupp-name">${esc(g)}</span>
        <span class="grupp-toggle" onclick="toggleGrupp('${g}',true)">alla</span>
        <span style="color:var(--muted);font-size:10px">·</span>
        <span class="grupp-toggle" onclick="toggleGrupp('${g}',false)">inga</span>
      </div>`;
    for(const h of hamnar){
      html+=`<label class="hamn-check"><input type="checkbox" value="${esc(h)}" onchange="hamnCh(this)"><span>${esc(h)}</span></label>`;
    }
    html+=`</div>`;
  }
  html+=`<span class="clear-hamn" onclick="clearHamnar()">Visa alla hamnar</span>`;
  document.getElementById('hamnpanel').innerHTML=html;
}

function toggleGrupp(g,on){
  document.querySelectorAll('#hamnpanel input').forEach(cb=>{
    const grp=cb.closest('.hamngrupp').querySelector('.hamngrupp-name').textContent;
    if(grp===g){ cb.checked=on; on?CHECKED_HAMNAR.add(cb.value):CHECKED_HAMNAR.delete(cb.value); }
  });
  applyFilters();
}
function hamnCh(cb){ cb.checked?CHECKED_HAMNAR.add(cb.value):CHECKED_HAMNAR.delete(cb.value); applyFilters(); }
function clearHamnar(){
  CHECKED_HAMNAR.clear();
  document.querySelectorAll('#hamnpanel input').forEach(cb=>cb.checked=false);
  applyFilters();
}

// ── Filters + render ─────────────────────────────────────────────────────────
function applyFilters(){
  if(!DATA) return;
  const iso=document.getElementById('dp').value||today();
  const dag=weekday(iso);
  const kat=document.getElementById('kat-filter').value;
  const red=document.getElementById('rederi-filter').value;
  const hamnOn=CHECKED_HAMNAR.size>0;

  let rows=DATA.schema.filter(r=>{
    if(r.veckodag!==dag) return false;
    if((DIR==='avgmot'||DIR==='ankmot')&&!r.mot_sverige) return false;
    if(DIR==='fran'&&!r.fran_sverige) return false;
    if(kat&&r.kategori!==kat) return false;
    if(red&&r.rederi!==red) return false;
    if(hamnOn&&!CHECKED_HAMNAR.has(r.avghamn)&&!CHECKED_HAMNAR.has(r.ankhamn)) return false;
    return true;
  });

  rows.sort((a,b)=>{
    let va,vb;
    if(DIR==='ankmot'){ va=parseMin(a.anktid,a.nasta_dag); vb=parseMin(b.anktid,b.nasta_dag); }
    else if(SORT_COL==='rederi'){ va=a.rederi; vb=b.rederi; }
    else { va=parseMin(a.avgtid,false); vb=parseMin(b.avgtid,false); }
    if(va<vb) return SORT_DIR==='asc'?-1:1;
    if(va>vb) return SORT_DIR==='asc'?1:-1;
    return 0;
  });

  let ivRows=DATA.intervall.filter(r=>{
    if((DIR==='avgmot'||DIR==='ankmot')&&!r.mot_sverige) return false;
    if(DIR==='fran'&&!r.fran_sverige) return false;
    if(kat&&r.kategori!==kat) return false;
    if(red&&r.rederi!==red) return false;
    return true;
  });

  // Infobar
  const dirl=DIR==='avgmot'?'Avgår mot Sverige':DIR==='ankmot'?'Ankommer till Sverige':'Avgår från Sverige';
  document.getElementById('infobar').innerHTML=
    `<strong>${rows.length}</strong> avgångar &nbsp;·&nbsp; ${esc(dirl)} &nbsp;·&nbsp; ${esc(longDate(iso))}`
    +(ivRows.length?` &nbsp;·&nbsp; +<strong>${ivRows.length}</strong> info-rutter`:'');

  // Dates
  const d0=iso;
  const d1=new Date(iso+'T12:00:00'); d1.setDate(d1.getDate()+1); const tom=d1.toISOString().slice(0,10);
  const d2=new Date(iso+'T12:00:00'); d2.setDate(d2.getDate()-1); const iga=d2.toISOString().slice(0,10);

  const dirLabel=DIR==='avgmot'?'⬇ Avgår mot Sverige':DIR==='ankmot'?'🇸🇪 Ankommer till Sverige':'⬆ Avgår från Sverige';
  let html=`<div class="sec-head"><h2>${dirLabel}</h2><span class="pill">${rows.length}</span></div>`;

  if(!rows.length){
    html+=`<div class="empty"><p>Inga avgångar matchar ditt urval för vald dag.</p></div>`;
  } else {
    html+=`<div class="tbl-wrap"><table><thead><tr>`;
    if(DIR==='ankmot'){
      html+=`<th>Avg.tid</th>`+thSort('anktid','Ank.tid');
    } else {
      html+=thSort('avgtid','Avg.tid')+`<th>Ank.tid</th>`;
    }
    html+=`<th>Sträcka</th>`+thSort('rederi','Rederi')+`<th>Typ</th><th>Status</th><th></th></tr></thead><tbody>`;

    for(const r of rows){
      const cls=r.mot_sverige?'mot-sv':'fran-sv';

      // Avg.tid
      let avgDatum='';
      if(DIR==='ankmot'&&r.nasta_dag) avgDatum=`<span class="t-datum">${esc(fmtShort(iga))}</span>`;
      else avgDatum=`<span class="t-datum">${esc(fmtShort(d0))}</span>`;

      // Ank.tid
      let ankHtml='<span class="t-anktid">—</span>';
      if(r.anktid){
        const t=r.anktid.replace(/\s*\(.*?\)\s*/g,'').replace(/\+1/,'').trim();
        const p1=r.nasta_dag?'<span class="plus1">+1</span>':'';
        const ankD=`<span class="t-datum">${esc(fmtShort(r.nasta_dag?tom:d0))}</span>`;
        ankHtml=`<span class="t-anktid">${esc(t)}${p1}</span>${ankD}`;
      }

      const stracka=`<span class="t-hamn">${esc(r.avghamn)}<span class="arrow">→</span>${esc(r.ankhamn)}</span>`;
      const link=r.kalla?`<a href="${esc(r.kalla)}" target="_blank" title="Tidtabell">🔗</a>`:'';

      html+=`<tr class="${cls}">
        <td><span class="t-time">${esc(r.avgtid)||'—'}</span>${avgDatum}</td>
        <td>${ankHtml}</td>
        <td>${stracka}</td>
        <td class="t-rederi">${esc(r.rederi)}</td>
        <td>${katBadge(r.kategori)}</td>
        <td>${verBadge(r.verifiering)}</td>
        <td class="t-link">${link}</td>
      </tr>`;
    }
    html+=`</tbody></table></div>`;
  }

  if(ivRows.length){
    html+=`<div class="sec-head" style="margin-top:8px"><h2>ℹ️ Info-rutter</h2><span class="pill">${ivRows.length}</span></div>
    <div class="iv-note">Dessa rutter har komplexa tidtabeller — kontrollera aktuella tider via länken hos respektive rederi.</div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>Rederi</th><th>Sträcka</th><th>Avgångstid</th><th>Frekvens</th><th>Anmärkning</th><th>Status</th><th></th>
    </tr></thead><tbody>`;
    for(const r of ivRows){
      const link=r.kalla?`<a href="${esc(r.kalla)}" target="_blank">🔗</a>`:'';
      html+=`<tr>
        <td class="t-rederi">${esc(r.rederi)}</td>
        <td class="t-hamn">${esc(r.rutt||'')}</td>
        <td style="font-size:12px">${esc(r.avgtid)||'—'}</td>
        <td style="font-size:11px;color:var(--muted)">${esc(r.frekvens)||'—'}</td>
        <td style="font-size:11px;color:var(--muted);max-width:240px">${esc(r.anmarkning)}</td>
        <td>${verBadge(r.verifiering)}</td>
        <td class="t-link">${link}</td>
      </tr>`;
    }
    html+=`</tbody></table></div>`;
  }

  document.getElementById('main').innerHTML=html;
}

function thSort(col,label){
  const cls=SORT_COL===col?(SORT_DIR==='asc'?' sort-asc':' sort-desc'):'';
  return `<th class="sortable${cls}" onclick="doSort('${col}')">${label}<span class="si"></span></th>`;
}
function doSort(col){
  SORT_COL===col?SORT_DIR=SORT_DIR==='asc'?'desc':'asc':(SORT_COL=col,SORT_DIR='asc');
  applyFilters();
}
function setDir(d){
  DIR=d;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.remove('on'));
  document.getElementById('btn-'+d).classList.add('on');
  SORT_COL=d==='ankmot'?'anktid':'avgtid'; SORT_DIR='asc';
  applyFilters();
}

async function loadData(){
  try{
    const res=await fetch('farjor_data.json');
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    DATA=await res.json();
    document.getElementById('updated-label').textContent='Uppdaterad '+(DATA.meta.uppdaterad||'–');
    const rSel=document.getElementById('rederi-filter');
    DATA.meta.rederier.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;rSel.appendChild(o);});
    buildHamnPanel();
    document.getElementById('loading').style.display='none';
    document.getElementById('dp').addEventListener('change',()=>{updateWday();applyFilters();});
    document.getElementById('kat-filter').addEventListener('change',applyFilters);
    document.getElementById('rederi-filter').addEventListener('change',applyFilters);
    applyFilters();
  }catch(e){
    document.getElementById('loading').style.display='none';
    document.getElementById('error-msg').style.display='block';
    document.getElementById('error-msg').textContent='Kunde inte ladda farjor_data.json: '+e.message;
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('dp').value=today();
  updateWday();
  setDir('avgmot');
  loadData();
});
</script>
</body>
</html>
